apiVersion: apps/v1

kind: Deployment

metadata:
  name: devops-frontend

spec:

  replicas: 2

  selector:
    matchLabels:
      app: devops-frontend

  template:

    metadata:
      labels:
        app: devops-frontend

    spec:

      containers:

        - name: frontend

          image: "946877383530.dkr.ecr.ap-south-1.amazonaws.com/devops-final-project:v1"

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"